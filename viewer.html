 <!doctype html>
 <html lang="zh-CN">
 <head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="default">
 <title>任务详情</title>
 <link rel="stylesheet" href="styles.css?v=3">
 </head>
 <body>
 <div class="viewer-shell">
   <div class="status-bar" style="background:transparent">
     <span id="clockText">9:41</span>
     <span class="right">
       <svg viewBox="0 0 16 12" fill="currentColor"><path d="M1 9h2v2H1zm4-2h2v4H5zm4-2h2v6H9zm4-2h2v8h-2z"/></svg>
       <svg viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4A8 8 0 0 0 1.6 6L0 4.4 4 0l1.6 1.6A9.4 9.4 0 0 1 8 1.2 9.4 9.4 0 0 1 14.8 6l-1.6 1.6A8 8 0 0 0 8 2.4zM8 6.4a3.2 3.2 0 0 0-2.3 5.4L4 13.6l1.6 1.6L8 13l2.4 2.2L12 13.6l-1.7-1.8A3.2 3.2 0 0 0 8 6.4z"/></svg>
       <svg viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2" stroke="currentColor"/><rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/><rect x="22" y="4" width="2" height="4" rx="0.5" fill="currentColor"/></svg>
     </span>
   </div>
 
   <div class="viewer-hero">
     <h1 id="v-title">加载中...</h1>
     <p id="v-sub">请稍候</p>
   </div>
 
   <div class="viewer-body" id="viewer-body">
     <div class="viewer-error" id="v-loading">
       <div class="spinner"></div>
       <p style="margin-top:12px">加载中...</p>
     </div>
   </div>
 </div>
 
 <div class="lightbox" id="lightbox" onclick="closeLightbox()">
   <button class="close">&times;</button>
   <img id="lightbox-img">
 </div>
 
 <div class="toast" id="toast"></div>
 
 <script src="viewer.js?v=3"></script>
 </body>
 </html>
